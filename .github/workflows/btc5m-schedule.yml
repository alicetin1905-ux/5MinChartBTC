name: BTC 5m analyse (elke 15 min)

on:
  schedule:
    # Elke 15 min, 2 min na het sluiten van een 5m-candle; niet op :00/:15/:30/:45,
    # want die drukke momenten slaat GitHub vaker over of vertraagt het. Tijden in UTC.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}       # handmatig starten via het Actions-tabblad

permissions:
  contents: write

concurrency:
  group: btc5m-schedule
  cancel-in-progress: false

env:
  REPORTS_BRANCH: btc-reports

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # eerste run speelt 14 dagen terug (~2 min)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies
        run: |
          pip install -r requirements.txt
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then pip install anthropic; fi

      - name: Lege rapportenmap klaarzetten (met de verzamelde data van de vorige run)
        run: |
          git worktree add --detach out
          git -C out checkout -q --orphan "$REPORTS_BRANCH-nieuw"
          git -C out rm -rfq .
          if git ls-remote --exit-code --heads origin "$REPORTS_BRANCH" >/dev/null; then
            git fetch -q --depth 1 origin "$REPORTS_BRANCH"
            # alleen de groeiende datasets gaan mee; al het andere wordt elke run opnieuw gemaakt
            for f in history.csv orderflow.csv book.csv; do
              git show "FETCH_HEAD:$f" > "out/$f" 2>/dev/null || rm -f "out/$f"
            done
          fi

      - name: Analyse draaien
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          python -m btc5m run --outdir out --sources okx,kraken,coinbase
          cp site/index.html site/engine.js site/app.js out/   # dashboard voor GitHub Pages
          touch out/.nojekyll

      - name: Samenvatting in de run tonen
        run: |
          if [ -f out/agent.md ]; then cat out/agent.md >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
          cat out/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Rapportenbranch vervangen door één verse commit
        # Eén commit in plaats van 96 per dag: zo groeit de repository niet met gigabytes per jaar.
        # Alle geschiedenis die nodig is, staat in history.csv, orderflow.csv en book.csv.
        run: |
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Analyse $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q -f origin "HEAD:$REPORTS_BRANCH"
