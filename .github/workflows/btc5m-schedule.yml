name: BTC 5m analyse (elke 15 min)

on:
  schedule:
    # Elke 15 min, 2 min na het sluiten van een 5m-candle; niet op :00/:15/:30/:45,
    # want die drukke momenten slaat GitHub vaker over of vertraagt het. Tijden in UTC.
    # Reserve: de planner van GitHub is "best effort" en sloeg in deze repo alle runs over.
    # De runs worden daarom vooral gestart door de keten onderaan (elke run start de volgende).
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}       # handmatig starten via het Actions-tabblad (start ook de keten opnieuw)

permissions:
  contents: write   # rapportenbranch bijwerken
  actions: write    # de volgende run starten (zelfstartende keten)

concurrency:
  group: btc5m-schedule
  cancel-in-progress: false

env:
  REPORTS_BRANCH: btc-reports

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # analyse (~1-2 min, eerste keer ~3) + wachten tot het volgende kwartier (≤ 15 min)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies
        run: |
          pip install -r requirements.txt
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then pip install anthropic; fi

      - name: Lege rapportenmap klaarzetten (met de verzamelde data van de vorige run)
        run: |
          git worktree add --detach out
          git -C out checkout -q --orphan "$REPORTS_BRANCH-nieuw"
          git -C out rm -rfq .
          if git ls-remote --exit-code --heads origin "$REPORTS_BRANCH" >/dev/null; then
            git fetch -q --depth 1 origin "$REPORTS_BRANCH"
            # alleen de groeiende datasets gaan mee; al het andere wordt elke run opnieuw gemaakt
            for f in history.csv orderflow.csv book.csv; do
              git show "FETCH_HEAD:$f" > "out/$f" 2>/dev/null || rm -f "out/$f"
            done
          fi

      - name: Analyse draaien
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          python -m btc5m run --outdir out --sources okx,kraken,coinbase
          cp site/index.html site/engine.js site/app.js out/   # dashboard voor GitHub Pages
          touch out/.nojekyll

      - name: Samenvatting in de run tonen
        run: |
          if [ -f out/agent.md ]; then cat out/agent.md >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
          cat out/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Rapportenbranch vervangen door één verse commit
        # Eén commit in plaats van 96 per dag: zo groeit de repository niet met gigabytes per jaar.
        # Alle geschiedenis die nodig is, staat in history.csv, orderflow.csv en book.csv.
        run: |
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Analyse $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q -f origin "HEAD:$REPORTS_BRANCH"

      - name: Wachten tot het volgende tijdstip en de volgende run starten
        # Zelfstartende keten: deze stap draait ook als de analyse mislukte, zodat de keten niet breekt.
        # Er wordt geen nieuwe run gestart als er al een andere run klaarstaat of bezig is (geen dubbele ketens).
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: btc5m-schedule.yml
          REF: ${{ github.event.repository.default_branch }}
        run: |
          now=$(date -u +%s)
          base=$(( now - now % 3600 ))
          for m in 3 18 33 48 63; do
            t=$(( base + m * 60 ))
            if [ "$t" -gt $(( now + 10 )) ]; then break; fi
          done
          echo "Volgende run om $(date -u -d @$t +%H:%M) UTC; wachten $(( t - now )) s"
          sleep $(( t - now ))
          others=$(gh run list --workflow "$WORKFLOW" --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != \"completed\")] | length")
          if [ "$others" -gt 0 ]; then
            echo "Er staat al een andere run klaar of loopt al ($others); geen nieuwe gestart."
          else
            gh workflow run "$WORKFLOW" --ref "$REF"
            echo "Volgende run gestart."
          fi
